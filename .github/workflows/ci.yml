  e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v2.1.2
        with:
          node-version: 18

      - name: Install dependencies Frontend
        run: npm ci

      - name: Start Vite server
